<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가평 캠핑포유 펜션&amp;캠핑 - 숙소소개</title>

  <!-- Preload critical resources -->
  <link rel="preload" href="styles/common.css" as="style">
  <link rel="preload" href="styles/main.css" as="style">

  <!-- Theme CSS -->
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/main.css">
  <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="가평 캠핑포유 펜션&캠핑 - 숙소소개" />
  <meta property="og:description" content="가평 캠핑포유는 맑은 계곡 바로 앞에서 프라이빗한 개별 테라스 바비큐와 불멍, 캠핑과 펜션을 함께 즐길 수 있는 힐링 숙소입니다." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/11/09/BuzxHZ974tpP.jpg" />
  <meta property="og:url" content="https://camping4u.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="가평 캠핑포유 펜션&캠핑 - 숙소소개" />
  <meta name="twitter:description" content="가평 캠핑포유는 맑은 계곡 바로 앞에서 프라이빗한 개별 테라스 바비큐와 불멍, 캠핑과 펜션을 함께 즐길 수 있는 힐링 숙소입니다." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/11/09/BuzxHZ974tpP.jpg" />
  <meta name="naver-site-verification" content="37d9e20b8323f9e9fc968dacf1afe518c61ca09a" />
  <meta name="google-site-verification" content="IU70DJ0p3-AC5FJ5gcn93SJWdv_VKvFqGvHi5ZR4Lqg" />
</head>
<body>

  <main>
      <section class="page-hero-section">
        <!-- CUSTOM FIELD : 메인 소개 섹션 이미지 매핑 (1장이면 고정 이미지, 2장 이상이면 슬라이더) -->
          <div class="hero-background">
              <div class="slider" data-main-hero-slider>
                  <!-- 동적으로 슬라이드가 생성됩니다 -->
              </div>
          </div>
          <!-- Slider Navigation (index 메인 히어로와 같은 버튼·프로그레스바, 타이틀에 맞춰 중앙 정렬) - 이미지 2장 이상일 때만 노출 -->
          <div class="main-hero-nav-overlay" data-main-hero-nav>
              <div class="main-hero-nav-container">
                  <div class="slider-nav">
                      <div class="slider-buttons">
                          <button type="button" class="slider-btn prev" aria-label="이전 이미지">‹</button>
                          <button type="button" class="slider-btn next" aria-label="다음 이미지">›</button>
                      </div>
                      <div class="progress-container">
                          <div class="progress-bar"></div>
                      </div>
                  </div>
              </div>
          </div>
          <!-- 페이지 제목 하드코딩 fixed -->
          <div class="page-title">
              <span class="property-name-kr" data-main-property-name-kr></span>
              <h1 class="typing-text" data-text="Prologue" style="--text-length: 8;">Prologue</h1>
          </div>
          <!-- Scroll Down Icon -->
          <div class="scroll-down-icon" onclick="scrollToContent()">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M7 10L12 15L17 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
          </div>
      </section>
      <div class="content-wrap scroll-target">
          <div class="main-container">
              <div class="text-content">
                  <div class="logo-line-container">
                      <!-- 숙소 영문명 매핑 fixed -->
                      <span class="logo-text-line" data-main-property-name-en></span>
                      <div class="horizontal-line"></div>
                  </div>
                  <!-- custom field : 메인 소개 섹션 타이틀/설명 매핑 -->
                  <div class="hero-content">
                      <h2 class="hero-title" data-main-about-title></h2>
                      <p class="hero-description" data-main-about-description></p>
                  </div>
              </div>
              <!-- custom field : 소개 블록 동적 생성 - 이미지1, 제목, 설명이 한블록-->
              <div class="about-content" data-main-introduction>
                  <!-- 동적으로 about-block들이 생성됩니다 -->
              </div>
          </div>

          <!-- 숙소 외경이미지 0번째 fixed -->
          <section class="full-banner" data-main-banner>
              <!-- 숙소 영문명 매핑 fixed -->
              <div class="closing-property-name" data-closing-property-name></div>
          </section>
      </div>
  </main>

  <!-- Common JavaScript -->
  <script src="js/common.js"></script>

  <!-- Include ImageWithFallback script -->
  <script src="js/image-with-fallback.js"></script>

  <!-- Image Helpers -->
  <script src="js/image-helpers.js"></script>

  <!-- Base Data Mapper (must load before preview-handler) -->
  <script src="js/data-mapper/core/base-mapper.js"></script>

  <!-- Preview Handler for Admin Integration -->
  <script src="js/preview-handler.js"></script>

  <!-- Main Page Mapper -->
  <script src="js/data-mapper/pages/main-mapper.js"></script>

  <!-- Header Footer Mapper -->
  <script src="js/data-mapper/pages/header-footer-mapper.js"></script>

  <!-- Header and Footer Loader -->
  <script src="js/header-footer-loader.js"></script>

  <!-- Fullscreen Slider Component (나중에 추가) -->
  <!-- <script src="js/components/fullscreen-slider.js"></script> -->

  <!-- Scroll Animations -->
  <script src="js/common/scroll-animations.js"></script>

  <!-- Page-specific script -->
  <script type="module" src="js/pages/main.js"></script>


</body>
</html>
